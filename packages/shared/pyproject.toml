[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soa-shared"
version = "0.1.0"
description = "Shared models and database for SoA Platform"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg2-binary",
    "python-dotenv",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["soa_shared*"]
