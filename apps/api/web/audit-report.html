<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- OpenAI (ChatGPT Ads) Measurement Pixel — the ONE deliberate
         exception to the Aug 19 decision that /r/ and /s/ carry no
         tracker.

         That decision STILL HOLDS unchanged for the landing's
         outreach-attribution visitor pixel: this document does not
         carry it, and staticHead.build.test.js asserts it can never
         gain one, so a merchant's forwarded report link stays out of
         outreach tooling. (That tag is named in audit.html's own
         comment and in the build test; it is deliberately not named
         here, because the assertion guarding this document is a
         case-insensitive match on its name across the whole served
         HTML — comments included.)

         The OpenAI pixel is an exception in kind, not in degree. The
         conversion it measures — audit_score_rendered, fired by
         src/lite/openaiPixel.js once a numeric composite has actually
         rendered — can only be observed on THIS document, because the
         report page is the only place a score exists at all. Putting
         it anywhere else would mean measuring something other than
         the conversion. And it fires only for the browser that
         submitted the run (isTokenOwned): a share-link visitor
         reading someone else's report never fires it, so the
         forwarded-link case stays silent here too.

         Written in at build time by vite.config.js's auditHeadPlugin
         from src/lite/openaiPixel.constants.js. -->
    <!--OPENAI_PIXEL-->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0166FF" />
    <!--AUDIT_HEAD-->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap"
      rel="stylesheet"/>
  </head>
  <body style="margin:0">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
