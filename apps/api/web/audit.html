<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- OpenAI (ChatGPT Ads) Measurement Pixel. Written in at build
         time by vite.config.js's auditHeadPlugin from
         src/lite/openaiPixel.constants.js, so the pixel ID lives in
         exactly one place rather than being copy-pasted into two HTML
         documents. Deliberately ahead of the font stylesheet and the
         lemlist tag: the inline loader has to define the oaiq queue
         before the async SDK arrives, which is the documented pattern.
         index.html (every other host) carries no marker and gets
         nothing — see staticHead.build.test.js. -->
    <!--OPENAI_PIXEL-->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0166FF" />
    <!--AUDIT_HEAD-->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap"
      rel="stylesheet"/>
    <!-- lemlist visitor tracking (outreach attribution) — landing only,
         deliberately. This is a static tag in audit.html specifically
         because Vercel routes audit.parleo.io's "/" (and only "/") to
         this document (vercel.json) — /r/ and /s/ are a different
         document (audit-report.html) that never carries this tag, so a
         merchant's forwarded report link stays tracker-free. See
         staticHead.build.test.js for the assertion that this holds in
         the real build output. -->
    <script async src="https://app.lemlist.com/api/visitors/tracking?k=gIK6DJ%2B%2FIC24uGNBnAo1AkBLPP0TVcAmhqLfj18vyXs%3D&t=tea_64F7BnppD5hii87MN"></script>
  </head>
  <body style="margin:0">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
