[alembic]
# Migration scripts live in /soa/alembic — NOT in /supply/alembic.
script_location = alembic

# URL is overridden at runtime by env.py using SUPABASE_DB_HOST_URL
# and SUPABASE_DB_PASSWORD env vars — same driver as /supply.
sqlalchemy.url = postgresql://placeholder

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
